syntax = "proto3";

package api;

option go_package = "github/ammar-alaa/order-mangement/common/api";



service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
}

service StockService {
  rpc CheckOrderInStock(CheckIfItemIsInStockRequest) returns (CheckIfItemIsInStockResponse);
}

message Items {
  string ID = 1;
  string Name = 2;
  int32 Quantity = 3;
    reserved 4;
    reserved "PriceID";
    int64 unit_price_minor = 5;
    string currency_code = 6;
}

message CheckIfItemIsInStockResponse {
  bool IsAvailable = 1;
  repeated Items Items = 2;
}

message ItemsWithQuantity {
  string ID = 1;
  int32 Quantity = 2;
}

message CheckIfItemIsInStockRequest {
  repeated ItemsWithQuantity Items = 1;
}


message CreateOrderRequest {
  string customerID = 1;
  repeated ItemsWithQuantity Items = 2;
}



message Order {
  string ID = 1;
  string customerID = 2;
  string Status = 3;
  repeated Items Items = 4;
}
