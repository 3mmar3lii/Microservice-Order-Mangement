syntax = "proto3";

package api;

option go_package = "github/ammar-alaa/order-mangement/common/api";



service OrderService {
  rpc CreateOrder(CreateOrderRequest) returns (Order);
}



message CreateOrderResponse {
  string OrderId = 1;
  string Status = 2;
  int32 Price = 3;
}

message ItemsWithQuantity {
  string ID = 1;
  int32 Quantity = 2;
}

message CreateOrderRequest {
  string customerID = 1;
  repeated ItemsWithQuantity Items = 2;
}

message Items {
  string ID = 1;
  string Name = 2;
  int32 Quantity = 3;
  string PriceID = 4;
}

message Order {
  string ID = 1;
  string customerID = 2;
  string Status = 3;
  repeated Items Items = 4;
}
